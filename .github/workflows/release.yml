# Releases are automatic: bump the "Version:" header and SC_VERSION in
# site-commander.php, then push to main. If no tag exists yet for that version,
# this builds site-commander.zip, creates the vX.Y.Z tag and publishes a GitHub
# release. Every site running Site Commander picks the update up from there.
# (Pushing a vX.Y.Z tag by hand, or "Run workflow", works too.)

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: ver
        run: |
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' site-commander.php | awk '{print $NF}')
          CONST=$(grep -m1 "define( 'SC_VERSION'" site-commander.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "header=$HEADER constant=$CONST ref=$GITHUB_REF_NAME"
          if [ "$HEADER" != "$CONST" ]; then
            echo "::error::Plugin header ($HEADER) and SC_VERSION ($CONST) differ"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$HEADER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $HEADER"; exit 1
          fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/v$HEADER" >/dev/null; then
            echo "v$HEADER is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint PHP
        if: steps.ver.outputs.skip != 'true'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p build/site-commander
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude '.gitignore' --exclude 'README.md' ./ build/site-commander/
          cd build && zip -rq site-commander.zip site-commander

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Site Commander ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/site-commander.zip
          generate_release_notes: true
